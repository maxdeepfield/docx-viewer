<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Docs Freakout</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div id="find-bar" class="find-bar" role="search" aria-label="Find in document" hidden>
            <input id="find-input" type="search" placeholder="Find in document" autocomplete="off" spellcheck="false" aria-label="Find in document">
            <span id="find-count" class="find-count" aria-live="polite">0/0</span>
            <button id="find-previous" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">&#8593;</button>
            <button id="find-next" type="button" title="Next match (Enter)" aria-label="Next match">&#8595;</button>
            <button id="find-close" type="button" title="Close (Esc)" aria-label="Close search">&#10005;</button>
        </div>
        <div id="content">
            <div class="empty-state">
                <div class="icon-placeholder">📄</div>
                <h1>Ready to view?</h1>
                <p>Drag & drop a <strong>.docx</strong> or <strong>.xlsx</strong> file here</p>
                <p class="secondary">or use File > Open (Ctrl+O)</p>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
